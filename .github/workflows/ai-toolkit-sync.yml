name: ai-toolkit sync

# Drift gate for the copied @thetiririri/ai-toolkit files: reinstalls the version the manifest records and
# fails when that changes anything, so the skills and the CLAUDE.md block only change through a toolkit release.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@thetiririri"
      - name: Reinstall the recorded toolkit version and fail on drift
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PKG_TOKEN }}
        run: |
          version=$(node -p 'require("./.claude/.ai-toolkit-manifest.json").version')
          npx --yes "@thetiririri/ai-toolkit@$version" --force
          paths=(.claude/skills CLAUDE.md .claude/.ai-toolkit-manifest.json)
          drift=$(git status --porcelain -- "${paths[@]}")
          if [ -n "$drift" ]; then
            echo "$drift"
            git diff -- "${paths[@]}"
            exit 1
          fi

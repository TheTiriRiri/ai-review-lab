# promptfoo evals for the review prompt: the same fixture diffs on three OpenRouter models.
# Run from the repo root: npm run eval (OPENROUTER_API_KEY from reviewer/.env or the environment).
# Results: the matrix in the terminal and evals/out/results.json. Never `promptfoo view`: it starts a local web server.
# prompts/review.txt is generated from src/review-schema.ts (npm run schema:emit), like the CI contract files.
# promptfoo renders vars as Nunjucks templates, so fixture diffs carry no {{, {% or {# (evals/fixtures.test.js);
# PROMPTFOO_DISABLE_TEMPLATING is not an option, it would leave {{diff}} in the prompt unfilled.
description: Code review prompt, three models, four fixture diffs

# The OpenRouter provider defaults to max_tokens 1024, which reasoning models spend before the JSON starts, and to
# showThinking true, which prefixes the graded output with "Thinking: <reasoning>" (evals/config.test.js). glm-5.3
# runs as the reviewer agent sends it, since eval.yml gates on it: temperature 0 and the provider routing and
# reasoning cap of MODEL_ROUTING in src/agent.ts.
providers:
  - id: openrouter:z-ai/glm-5.3 # the variant 2 default
    config:
      max_tokens: 32768
      temperature: 0
      showThinking: false
      provider:
        order: [digitalocean, sail-research]
        allow_fallbacks: false
        require_parameters: true
      passthrough:
        reasoning:
          max_tokens: 12000
  - id: openrouter:anthropic/claude-sonnet-5.5 # the model family variant 1 runs on
    config:
      max_tokens: 32768
      showThinking: false
  - id: openrouter:deepseek/deepseek-v4.1-flash # the cheap candidate
    config:
      max_tokens: 32768
      showThinking: false
  # Optional fourth: anthropic:messages:claude-sonnet-5-5 (ANTHROPIC_API_KEY), direct versus through OpenRouter.

prompts:
  - file://prompts/review.txt

defaultTest:
  options:
    provider: # llm-rubric grader
      id: openrouter:anthropic/claude-sonnet-5.5
      config:
        max_tokens: 4096
        showThinking: false
    transform: file://transforms/strip-fences.js

tests:
  - description: React 16 to 19 migration with three planted flaws
    vars:
      diff: file://fixtures/react19-migration.diff
    assert:
      - type: is-json
        value: file://../schema/review-schema.json
      - type: llm-rubric
        value: >-
          The review names all three planted flaws and says why each breaks the component: the effect does not
          re-run when userId changes, the presence subscription is never cleaned up, and the interval callback
          keeps a stale count.
      - type: javascript
        value: |
          const r = typeof output === 'string' ? JSON.parse(output) : output;
          return r.verdict === 'fail';

  - description: SQL injection through orderBy and a logged API token (fixture PR 2)
    vars:
      diff: file://fixtures/sql-injection.diff
    assert:
      - type: is-json
        value: file://../schema/review-schema.json
      - type: llm-rubric
        value: >-
          The review rejects the change, points to the SQL injection through the unchecked ORDER BY expression,
          and points to the API token that loadConfig now writes to the log.
      - type: javascript
        value: |
          const r = typeof output === 'string' ? JSON.parse(output) : output;
          return r.verdict === 'fail' && r.criteria.securitySafety.score <= 3;

  - description: Clean change, negative counts in addBusinessDays (fixture PR 1)
    vars:
      diff: file://fixtures/clean-business-days.diff
    assert:
      - type: is-json
        value: file://../schema/review-schema.json
      - type: javascript
        value: |
          const r = typeof output === 'string' ? JSON.parse(output) : output;
          return r.verdict === 'pass' && Object.values(r.criteria).every((c) => c.score >= 6);

  - description: Inclusive daysBetween, a weekend bug in addBusinessDays and skipped tests (fixture PR 3)
    vars:
      diff: file://fixtures/logic-no-tests.diff
    assert:
      - type: is-json
        value: file://../schema/review-schema.json
      - type: llm-rubric
        value: >-
          The review rejects the change and names its planted flaws: the new daysBetween is wrong for the same date
          and for a range that runs backwards, and it no longer ignores the time of day; addBusinessDays now counts a
          day before it checks for a weekend, so from a Saturday it lands a day late; and the two tests that the
          change breaks are skipped instead of fixed.
      - type: javascript
        value: |
          const r = typeof output === 'string' ? JSON.parse(output) : output;
          return r.verdict === 'fail' && r.criteria.implementationCorrectness.score <= 5 && r.criteria.testRiskCoverage.score <= 4;

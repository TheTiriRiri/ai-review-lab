# Variant 2: builds the reviewer package (reviewer/, Vercel AI SDK + OpenRouter) from this checkout and runs it
# on one pull request diff. The full review JSON (review plus meta) lands in $RUNNER_TEMP/ai-review.json; the
# calling workflow comments, labels and gates from the outputs.
name: AI Reviewer
description: Run the reviewer agent from reviewer/ on a pull request diff

inputs:
  api-key:
    description: OpenRouter API key
    required: true
  pr-title:
    description: Pull request title
    required: true
  pr-body:
    description: Pull request description (optional; costs tokens)
    required: false
    default: ""
  diff-file:
    description: Path to a file with the pull request diff (a file avoids step-output size and newline limits)
    required: true
  model:
    description: OpenRouter model id passed to the reviewer
    required: false
    default: z-ai/glm-5.3

outputs:
  verdict:
    description: Binding pass or fail verdict from the reviewer
    value: ${{ steps.agent.outputs.verdict }}
  review-file:
    description: Path to the full review JSON
    value: ${{ steps.agent.outputs.review-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Build reviewer
      shell: bash
      run: npm ci --ignore-scripts && npm run -w reviewer build

    - name: Run reviewer
      id: agent
      shell: bash
      # Untrusted pull request text and the key go through env, never interpolated into the script.
      env:
        OPENROUTER_API_KEY: ${{ inputs.api-key }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        DIFF_FILE: ${{ inputs.diff-file }}
        REVIEW_MODEL: ${{ inputs.model }}
      run: |
        review_file="$RUNNER_TEMP/ai-review.json"
        node "$GITHUB_WORKSPACE/reviewer/dist/review.js" > "$review_file"
        verdict=$(jq -er '.verdict | select(. == "pass" or . == "fail")' "$review_file")
        echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
        echo "review-file=$review_file" >> "$GITHUB_OUTPUT"
        jq 'del(.summary)' "$review_file"
